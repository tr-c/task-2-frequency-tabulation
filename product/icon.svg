  <rect x="20" y="26" width="10" height="30" rx="2" fill="#4f46e5"/>
  <rect x="34" y="14" width="10" height="42" rx="2" fill="#6366f1"/>
  <rect x="48" y="32" width="10" height="24" rx="2" fill="#4f46e5"/>
